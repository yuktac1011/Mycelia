# docker-compose.yml
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  neo4j:
    image: neo4j:5.14.0-community
    ports:
      - "7474:7474"  # HTTP Browser UI
      - "7687:7687"  # Bolt protocol (how Python talks to it)
    environment:
      - NEO4J_AUTH=neo4j/mycelia_secret_123  # Set a default password